name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz openjdk-17-jre-headless

      - name: Install package
        run: python -m pip install -e .

      - name: Download pinned PlantUML jar
        run: plantuml-skill init-assets

      - name: Check renderer stack
        run: plantuml-skill doctor

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check skill package
        run: plantuml-skill improve lint-skill

      - name: Build install packages
        run: plantuml-skill package build --version ci --output dist/packages --c4-source tests/fixtures/vendor/c4-package

      - name: Run fixture corpus smoke workflow
        run: |
          plantuml-skill coverage --json
          plantuml-skill acquire --source fixtures --output data/manifests/fixtures.jsonl
          plantuml-skill render --manifest data/manifests/fixtures.jsonl --output data/manifests/rendered.jsonl
          plantuml-skill verify --manifest data/manifests/rendered.jsonl --output data/manifests/verified.jsonl
          plantuml-skill audit-licenses --manifest data/manifests/verified.jsonl
          plantuml-skill build-splits --manifest data/manifests/verified.jsonl
          plantuml-skill report --manifest data/manifests/verified.jsonl

      - name: Run improvement smoke test
        run: |
          plantuml-skill improve init --no-overwrite
          plantuml-skill improve make-suite --output data/improvement/suites/ci-smoke.jsonl --max-cases 5
          plantuml-skill improve begin-run --suite data/improvement/suites/ci-smoke.jsonl --run-id ci-smoke
          plantuml-skill improve evaluate --run ci-smoke --allow-missing-attempts
          plantuml-skill improve next-prompt --run ci-smoke

  windows-packages:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Run release package tests
        run: python -m unittest tests.test_release_packages -v

      - name: Build install packages
        run: plantuml-skill package build --version ci --output dist/packages --c4-source tests/fixtures/vendor/c4-package

      - name: Verify Windows package artifacts
        shell: pwsh
        run: |
          foreach ($name in @(
            "plantuml-diagram-core-ci-windows.zip",
            "plantuml-diagram-validate-ci-windows.zip",
            "plantuml-diagram-render-ci-windows.zip",
            "plantuml-diagram-c4-ci-windows.zip",
            "SHA256SUMS"
          )) {
            if (-not (Test-Path "dist/packages/$name")) {
              throw "Missing package artifact: $name"
            }
          }
